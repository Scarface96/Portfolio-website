<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Tony Mulunda Portfolio</title>
  <desc id="desc">Animated portfolio banner for Tony Mulunda</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#172554"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="420" rx="30" fill="url(#bg)"/>
  <g opacity="0.22">
    <circle cx="140" cy="95" r="68" fill="#22d3ee"><animate attributeName="r" values="55;78;55" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1070" cy="330" r="96" fill="#f472b6"><animate attributeName="r" values="82;112;82" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="1015" cy="90" r="50" fill="#a78bfa"><animate attributeName="cy" values="70;110;70" dur="5s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08">
    <path d="M0 80 H1200 M0 160 H1200 M0 240 H1200 M0 320 H1200"/>
    <path d="M160 0 V420 M320 0 V420 M480 0 V420 M640 0 V420 M800 0 V420 M960 0 V420"/>
  </g>
  <text x="600" y="145" text-anchor="middle" fill="#e2e8f0" font-family="Arial, Helvetica, sans-serif" font-size="25" letter-spacing="7">PORTFOLIO WEBSITE</text>
  <text x="600" y="225" text-anchor="middle" fill="url(#accent)" filter="url(#glow)" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700">TONY MULUNDA</text>
  <text x="600" y="282" text-anchor="middle" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="25">Data • Web Development • Business Analysis • Automation</text>
  <g transform="translate(405 330)">
    <rect width="390" height="4" rx="2" fill="#334155"/>
    <rect width="95" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="x" values="0;295;0" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>