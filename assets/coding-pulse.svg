<svg xmlns="http://www.w3.org/2000/svg" width="820" height="220" viewBox="0 0 820 220" role="img" aria-labelledby="title desc">
  <title id="title">Coding Pulse</title>
  <desc id="desc">Animated terminal inspired coding pulse graphic</desc>
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset="0.5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect x="10" y="10" width="800" height="200" rx="24" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="43" cy="38" r="7" fill="#fb7185"/><circle cx="67" cy="38" r="7" fill="#facc15"/><circle cx="91" cy="38" r="7" fill="#4ade80"/>
  <text x="410" y="44" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="16">portfolio-terminal</text>
  <text x="50" y="96" fill="#22d3ee" font-family="monospace" font-size="21">$</text>
  <text x="78" y="96" fill="#e2e8f0" font-family="monospace" font-size="21">build solutions that create value</text>
  <rect x="50" y="132" width="720" height="5" rx="3" fill="#1e293b"/>
  <rect x="50" y="132" width="110" height="5" rx="3" fill="url(#line)">
    <animate attributeName="x" values="50;660;50" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <text x="50" y="177" fill="#94a3b8" font-family="monospace" font-size="17">data + code + business + automation</text>
  <rect x="426" y="160" width="12" height="22" fill="#a78bfa"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
</svg>