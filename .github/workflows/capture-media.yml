# Rebuilds each project and captures fresh screenshots and screen recordings for the portfolio.
# Run it from the Actions tab (optionally naming projects), or push changes to tools/capture_media.py
# on the media-refresh branch. Results are committed back to the branch that ran it.
name: Capture project media

on:
  workflow_dispatch:
    inputs:
      projects:
        description: "Space-separated slugs to capture (blank = all)"
        required: false
        default: ""
  push:
    branches: ["media-refresh"]
    paths: ["tools/capture_media.py", ".github/workflows/capture-media.yml"]

permissions:
  contents: write

concurrency:
  group: capture-media-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q playwright pillow pandas numpy scikit-learn statsmodels plotly duckdb openpyxl pytest
          python -m playwright install --with-deps chromium

      - name: Build every project and capture media
        run: python -u tools/capture_media.py ${{ github.event.inputs.projects }} 2>&1 | tee tools/capture-log.txt; exit ${PIPESTATUS[0]}

      - name: Commit the new media
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media tools/media-manifest.json tools/capture-log.txt tools/debug-*.png 2>/dev/null || git add media tools/media-manifest.json tools/capture-log.txt
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Capture fresh project media"
          git push
